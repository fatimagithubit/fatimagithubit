{% extends 'base.html' %}

{% block title %}Delete Template{% endblock %}

{% block content %}
  <h2>Delete Template</h2>
  <p>Are you sure you want to delete "{{ object.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'template_list' %}">Cancel</a>
  </form>
{% endblock %}
